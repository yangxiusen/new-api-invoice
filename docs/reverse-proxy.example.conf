# Add inside the EXISTING HTTPS server. Keep the host's /api/ and /sign-in routes.
location = /invoice { return 308 /invoice/; }
location /invoice/ {
    proxy_pass http://invoice:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /invoice-api/ {
    client_max_body_size 11m;
    proxy_read_timeout 120s;
    proxy_pass http://invoice:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
}
# New API host settings: SESSION_COOKIE_SECURE=true, TRUSTED_URL=<external HTTPS origin>.
# Invoice API requires Bearer, cookies alone are never sufficient.
