# 添加到New API现有域名的同一个 server {} 内，与 location / 同级。
# 每次升级New API后检查此配置，保留或重新加入以下规则，避免覆盖丢失。
# invoice-local:3001按实际部署替换；compose.example.yaml可使用invoice:3001。
# Nginx和发票容器需网络互通；原站 /api/ 和 /sign-in 继续转发New API。
# 发票入口
location = /invoice {
    return 308 /invoice/;
}

# 发票页面
location /invoice/ {
    proxy_pass http://invoice-local:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 发票接口
location /invoice-api/ {
    client_max_body_size 11m;
    proxy_pass http://invoice-local:3001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 120s;
}

# PUBLIC_ORIGIN = 浏览器访问New API的origin，不带路径。
# 检查 nginx -t 成功后再重载 nginx -s reload。
# HTTPS原站配置：SESSION_COOKIE_SECURE=true，TRUSTED_URL为外部HTTPS origin。
